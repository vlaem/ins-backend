/v1/current-user:
  get:
    security:
      - bearerAuth: []
    tags:
      - CurrentUser
    summary: Get current authenticated user
    description: Get current authenticated user
    operationId: getCurrentUser
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: User ID
                email:
                  type: string
                  description: User email
      '401':
        description: Unauthorized
