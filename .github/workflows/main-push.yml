name: Main Merge
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'      
concurrency:
  group: main-push
jobs:
  unit-tests:
    uses: vlaem/ins-backend/.github/workflows/unit-tests.yml@main
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.BUILD_IMAGE_ACCESS_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ins-backend:${{ github.sha }}   
            ghcr.io/${{ github.repository_owner }}/ins-backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      - # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
  deploy:
    needs: build-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Deploy to dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: dokku@${{ secrets.DOKKU_HOST }}:22/ins-backend
          deploy_docker_image: ghcr.io/${{ github.repository_owner }}/ins-backend:${{ github.sha }}
          ssh_private_key: ${{ secrets.DOKKU_SSH_KEY }}