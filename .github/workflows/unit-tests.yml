name: Unit Tests
on:
  pull_request:
    branches:
      - main
  workflow_call:
jobs:  
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Setup node env
      uses: actions/setup-node@v3
      with:
        node-version: "18.16.0"
        cache: "yarn"
    - name: install packages
      run: yarn install
    - name: run eslint
      run: yarn lint  
    - name: run tests
      run: yarn test:unit